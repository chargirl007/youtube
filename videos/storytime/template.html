<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Burbank Big";
        src: url("fonts/BurbankBigRegular-Black.otf") format("opentype");
        font-weight: 900;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-400-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      /* Palette pulled from the footage: Ivy emerald, hair crimson, room lilac. */
      :root {
        --green: #2fd36b;
        --green-deep: #0f7a3a;
        --red: #ff3b4e;
        --lilac: #d9a8ff;
        --ink: #0d0d10;
        --glass: rgba(13, 13, 16, 0.62);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Inter", "Burbank Big", sans-serif;
      }
      #stage {
        position: relative;
        width: 720px;
        height: 1280px;
        overflow: hidden;
      }
      /* Push-ins centre on her face. */
      #video-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 360px 400px;
      }
      #video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Soft scrim so captions read over the sequined dress. */
      #scrim {
        position: absolute;
        left: 0;
        right: 0;
        top: 640px;
        height: 640px;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.28) 35%, rgba(0, 0, 0, 0.42) 100%);
      }

      /* Captions: one consistent spot, below the face and above the Reels UI. */
      .cap {
        position: absolute;
        left: 60px;
        width: 600px;
        top: 860px;
        height: 120px;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .cap-in {
        text-align: center;
        font-weight: 700;
        font-size: 44px;
        line-height: 1.12;
        color: #fff;
        letter-spacing: -0.3px;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55), 0 0 14px rgba(0, 0, 0, 0.6);
      }
      .cap-in .g {
        color: var(--green);
      }
      .cap-in .r {
        color: var(--red);
      }

      /* Callouts: left-aligned, squared-off, generous spacing. */
      .co {
        position: absolute;
        left: 60px;
        top: 690px;
        width: 600px;
        z-index: 5;
        pointer-events: none;
      }
      .co-in {
        opacity: 0;
      }
      .co.card .co-in {
        display: inline-block;
        padding: 16px 22px 18px;
        background: var(--glass);
        border-left: 4px solid var(--green);
        border-radius: 6px;
        color: #fff;
        backdrop-filter: blur(6px);
      }
      .kicker {
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 2.4px;
        color: var(--lilac);
        margin-bottom: 6px;
      }
      .name {
        font-family: "Burbank Big", "Inter", sans-serif;
        font-size: 40px;
        line-height: 1;
        letter-spacing: 0.5px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 3px solid var(--green);
      }
      .leaf {
        width: 44px;
        height: 44px;
      }

      /* Hook (first seconds): editorial headline, no box. */
      .co.hook {
        top: 640px;
      }
      .co.hook .co-in {
        color: #fff;
      }
      .hook-title {
        font-family: "Burbank Big", "Inter", sans-serif;
        font-size: 64px;
        line-height: 0.98;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45), 0 0 18px rgba(0, 0, 0, 0.5);
      }
      .hook-title em {
        font-style: normal;
        color: var(--green);
      }
      .rule {
        margin-top: 14px;
        width: 220px;
        height: 4px;
        background: var(--red);
        transform-origin: 0 50%;
      }

      /* Chapter marker: top band above her hair. */
      .co.chapter {
        top: 120px;
      }
      .chapter {
        display: inline-block;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #fff;
        padding: 9px 16px 9px 0;
        border-bottom: 3px solid var(--green);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      }
      .chapter b {
        color: var(--green);
        margin-right: 10px;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .stat .num {
        font-family: "Burbank Big", "Inter", sans-serif;
        font-size: 84px;
        line-height: 0.85;
        color: var(--green);
      }
      .stat .unit {
        font-weight: 700;
        font-size: 24px;
        line-height: 1.15;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .li {
        font-size: 24px;
        line-height: 1.3;
        font-weight: 400;
        margin-top: 4px;
      }
      .li .who {
        display: inline-block;
        min-width: 112px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: var(--green);
        margin-right: 6px;
      }
      .li .who.red {
        color: var(--red);
      }

      .flow {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chip {
        font-weight: 700;
        font-size: 22px;
        padding: 6px 12px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 4px;
      }
      .chip.red {
        border-color: var(--red);
        color: var(--red);
      }
      .arrow {
        width: 40px;
        height: 2px;
        background: #fff;
        position: relative;
      }
      .arrow::after {
        content: "";
        position: absolute;
        right: -1px;
        top: -5px;
        border-left: 10px solid #fff;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .toggle-row .kicker {
        margin: 0;
        color: #fff;
      }
      .toggle {
        position: relative;
        width: 64px;
        height: 34px;
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.25);
      }
      .knob {
        position: absolute;
        left: 3px;
        top: 3px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #fff;
      }

      .alert {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .alert .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 12px var(--red);
      }
      .co#alert .co-in {
        border-left-color: var(--red);
      }

      /* Punchline: the one loud moment, still no box. */
      .co.punch {
        top: 680px;
        left: 0;
        width: 720px;
        text-align: center;
      }
      .punch {
        font-family: "Burbank Big", "Inter", sans-serif;
        font-size: 92px;
        line-height: 1;
        color: var(--red);
        -webkit-text-stroke: 9px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 6px 0 var(--ink);
      }

      .pull {
        font-family: "Burbank Big", "Inter", sans-serif;
        font-size: 38px;
        line-height: 1.05;
      }
      .pull em {
        font-style: normal;
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="storytime" data-start="0" data-duration="{{DURATION}}" data-fps="30" data-width="720" data-height="1280">
      <div id="video-wrap">
        <video id="bg-video" src="input-video.mp4" playsinline data-has-audio="true" data-start="0" data-duration="{{DURATION}}" data-track-index="1"></video>
      </div>
      <div id="scrim"></div>

      {{CALLOUTS}}

      {{CAPTIONS}}

      {{SFX}}

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const tl = window.gsap.timeline({ paused: true });
          {{TIMELINE}}
          window.__timelines = window.__timelines || {};
          window.__timelines["storytime"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
