<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Burbank Big";
        src: url("fonts/BurbankBigRegular-Black.otf") format("opentype");
        font-weight: 900;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Caveat";
        src: url("fonts/Caveat-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      /* Same palette as the reel: Ivy emerald, hair crimson, room lilac. */
      :root {
        --green: #2fd36b;
        --red: #ff3b4e;
        --lilac: #d9a8ff;
        --ink: #1a1020;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Inter", "Burbank Big", "Caveat", sans-serif;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      /* Scrapbook: the cut-out with a white sticker edge, nudged right and a touch larger. */
      #person {
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.3));
      }


      #tag {
        position: absolute;
        left: 22px;
        top: 430px;
        transform: rotate(-10deg);
        font-family: "Caveat", sans-serif;
        font-weight: 700;
        font-size: 52px;
        color: #fff;
        -webkit-text-stroke: 3px var(--ink);
        paint-order: stroke fill;
      }

      /* Title: arched over her head (top band, above the eyes). */
      #arch {
        position: absolute;
        left: 0;
        top: 0px;
        width: 1080px;
        height: 380px;
        overflow: visible;
      }
      #arch text {
        font-family: "Burbank Big", sans-serif;
        font-size: 94px;
        letter-spacing: 0px;
        fill: #fff;
        stroke: var(--ink);
        stroke-width: 12px;
        paint-order: stroke fill;
        stroke-linejoin: round;
      }
      #arch text.green {
        font-size: 92px;
        fill: var(--green);
      }
      #title {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 212px;
        text-align: center;
      }
      .big {
        font-family: "Burbank Big", sans-serif;
        font-size: 118px;
        line-height: 0.92;
        color: #fff;
        letter-spacing: 1px;
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 8px 0 var(--ink);
      }
      .hand {
        margin-top: 8px;
        font-family: "Caveat", sans-serif;
        font-weight: 700;
        font-size: 80px;
        line-height: 1;
        color: var(--green);
        -webkit-text-stroke: 12px #fff;
        paint-order: stroke fill;
        filter: drop-shadow(0 6px 0 var(--ink));
      }

      /* Small die-cut stickers: ivy leaves + a doodle basket (from the story). */
      .sticker {
        position: absolute;
        filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.35));
      }
      #leaf1 { left: 935px; top: 350px; width: 100px; transform: rotate(18deg); }
      #leaf2 { left: 50px; top: 520px; width: 80px; transform: rotate(-70deg); }
      #basket { left: 905px; top: 880px; width: 140px; transform: rotate(10deg); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="storytime-cover" data-start="0" data-duration="1" data-fps="30" data-width="1080" data-height="1920">
      <img class="layer" src="bg.jpg" alt="" />

      <div id="tag">storytime ✦</div>

      <svg id="leaf1" class="sticker" viewBox="0 0 120 120">
        <path d="M14 104 C14 50 52 18 108 10 C104 64 72 104 14 104 Z" fill="#2fd36b" stroke="#fff" stroke-width="9" stroke-linejoin="round" />
        <path d="M22 96 L84 34" stroke="#0f5a2b" stroke-width="5" stroke-linecap="round" />
      </svg>
      <svg id="leaf2" class="sticker" viewBox="0 0 120 120">
        <path d="M14 104 C14 50 52 18 108 10 C104 64 72 104 14 104 Z" fill="#2fd36b" stroke="#fff" stroke-width="9" stroke-linejoin="round" />
        <path d="M22 96 L84 34" stroke="#0f5a2b" stroke-width="5" stroke-linecap="round" />
      </svg>
      <svg id="basket" class="sticker" viewBox="0 0 140 120">
        <g stroke="#fff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="#fff">
          <path d="M14 46 H126 L112 108 H28 Z" />
          <path d="M40 46 C40 14 100 14 100 46" fill="none" />
        </g>
        <g stroke="#1a1020" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M14 46 H126 L112 108 H28 Z" fill="#ff3b4e" />
          <path d="M40 46 C40 14 100 14 100 46" fill="none" />
          <path d="M50 58 L54 98 M70 58 V98 M90 58 L86 98" />
        </g>
      </svg>

      <svg id="arch" viewBox="0 0 1080 380">
        <path id="arc" d="M 14 250 Q 540 -40 1066 250" fill="none" />
        <path id="arc2" d="M 170 345 Q 540 125 910 345" fill="none" />
        <text><textPath href="#arc" startOffset="50%" text-anchor="middle">I ALMOST GOT IN A FIGHT</textPath></text>
        <text class="green"><textPath href="#arc2" startOffset="50%" text-anchor="middle">[WITH A THIEF]</textPath></text>
      </svg>

      <script>
        window.__timelines = window.__timelines || {};
      </script>
    </div>
  </body>
</html>
