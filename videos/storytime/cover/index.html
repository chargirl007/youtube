<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Burbank Big";
        src: url("fonts/BurbankBigRegular-Black.otf") format("opentype");
        font-weight: 900;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Caveat";
        src: url("fonts/Caveat-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      /* Same palette as the reel: Ivy emerald, hair crimson, room lilac. */
      :root {
        --green: #2fd36b;
        --red: #ff3b4e;
        --lilac: #d9a8ff;
        --ink: #1a1020;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Inter", "Burbank Big", "Caveat", sans-serif;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      /* Scrapbook: the cut-out with a white sticker edge, nudged right and a touch larger. */
      #person {
        transform: translate(70px, 60px) scale(1.04);
        transform-origin: 50% 40%;
        filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.35));
      }

      /* Hand-drawn hearts row, like the reference doodles. */
      #hearts {
        position: absolute;
        left: 130px;
        top: 300px;
        width: 380px;
        height: 90px;
        transform: rotate(-8deg);
      }

      #tag {
        position: absolute;
        left: 96px;
        top: 410px;
        transform: rotate(-6deg);
        font-family: "Caveat", sans-serif;
        font-weight: 700;
        font-size: 64px;
        color: #fff;
        -webkit-text-stroke: 3px var(--ink);
        paint-order: stroke fill;
      }

      /* Title: chunky white with ink outline, slight tilt, bracketed hand-lettered line. */
      #title {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 1010px;
        text-align: center;
        transform: rotate(-4deg);
      }
      .big {
        font-family: "Burbank Big", sans-serif;
        font-size: 118px;
        line-height: 0.92;
        color: #fff;
        letter-spacing: 1px;
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 8px 0 var(--ink);
      }
      .hand {
        margin-top: 8px;
        font-family: "Caveat", sans-serif;
        font-weight: 700;
        font-size: 128px;
        line-height: 1;
        color: var(--green);
        -webkit-text-stroke: 12px #fff;
        paint-order: stroke fill;
        filter: drop-shadow(0 6px 0 var(--ink));
      }

      /* Small die-cut stickers: ivy leaves + a doodle basket (from the story). */
      .sticker {
        position: absolute;
        filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.35));
      }
      #leaf1 { left: 820px; top: 280px; width: 150px; transform: rotate(18deg); }
      #leaf2 { left: 70px; top: 1440px; width: 120px; transform: rotate(-24deg); }
      #basket { left: 830px; top: 1420px; width: 170px; transform: rotate(10deg); }
      #squiggle { left: 690px; top: 1350px; width: 150px; transform: rotate(-10deg); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="storytime-cover" data-start="0" data-duration="1" data-fps="30" data-width="1080" data-height="1920">
      <img class="layer" src="bg_soft.jpg" alt="" />
      <img id="person" class="layer" src="person_sticker_1080.png" alt="" />

      <svg id="hearts" viewBox="0 0 380 90">
        <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 70 C10 52 6 36 18 28 C26 23 33 28 36 36 C40 27 49 23 56 29 C66 38 56 54 30 70 Z" />
          <path d="M110 64 C92 48 88 34 99 27 C106 23 113 27 116 34 C119 26 127 22 133 28 C142 36 133 50 110 64 Z" />
          <path d="M188 58 C172 44 168 32 178 26 C184 22 190 26 193 32 C196 25 203 22 209 27 C217 34 209 46 188 58 Z" />
          <path d="M262 52 C248 40 245 30 253 25 C259 22 264 25 266 30 C269 24 275 21 280 26 C287 32 280 42 262 52 Z" />
          <path d="M330 46 C318 36 316 28 322 24 C327 21 331 24 333 28 C335 23 340 21 344 25 C350 30 344 38 330 46 Z" />
        </g>
      </svg>
      <div id="tag">storytime ✦</div>

      <svg id="leaf1" class="sticker" viewBox="0 0 120 120">
        <path d="M14 104 C14 50 52 18 108 10 C104 64 72 104 14 104 Z" fill="#2fd36b" stroke="#fff" stroke-width="9" stroke-linejoin="round" />
        <path d="M22 96 L84 34" stroke="#0f5a2b" stroke-width="5" stroke-linecap="round" />
      </svg>
      <svg id="leaf2" class="sticker" viewBox="0 0 120 120">
        <path d="M14 104 C14 50 52 18 108 10 C104 64 72 104 14 104 Z" fill="#2fd36b" stroke="#fff" stroke-width="9" stroke-linejoin="round" />
        <path d="M22 96 L84 34" stroke="#0f5a2b" stroke-width="5" stroke-linecap="round" />
      </svg>
      <svg id="basket" class="sticker" viewBox="0 0 140 120">
        <g stroke="#fff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="#fff">
          <path d="M14 46 H126 L112 108 H28 Z" />
          <path d="M40 46 C40 14 100 14 100 46" fill="none" />
        </g>
        <g stroke="#1a1020" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M14 46 H126 L112 108 H28 Z" fill="#ff3b4e" />
          <path d="M40 46 C40 14 100 14 100 46" fill="none" />
          <path d="M50 58 L54 98 M70 58 V98 M90 58 L86 98" />
        </g>
      </svg>
      <svg id="squiggle" class="sticker" viewBox="0 0 150 60">
        <path d="M6 40 C26 10 40 54 60 26 C80 2 92 50 112 22 C122 10 134 18 144 12" fill="none" stroke="#d9a8ff" stroke-width="7" stroke-linecap="round" />
      </svg>

      <div id="title">
        <div class="big">I ALMOST GOT IN<br />A FIGHT</div>
        <div class="hand">[with a thief]</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
      </script>
    </div>
  </body>
</html>
