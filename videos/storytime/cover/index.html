<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Burbank Big";
        src: url("fonts/BurbankBigRegular-Black.otf") format("opentype");
        font-weight: 900;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      :root {
        --green: #2fd36b;
        --red: #ff3b4e;
        --lilac: #d9a8ff;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Inter", "Burbank Big", sans-serif;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      /* Scrim under the title; the face (y 540-835) stays untouched. */
      #scrim {
        position: absolute;
        left: 0;
        right: 0;
        top: 960px;
        height: 960px;
        background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.45) 40%, rgba(0, 0, 0, 0.7) 100%);
      }
      /* Title block sits inside the centre 3:4 crop (y 240-1680) the profile grid shows. */
      #title {
        position: absolute;
        left: 90px;
        width: 900px;
        top: 1180px;
        color: #fff;
      }
      .kicker {
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 6px;
        color: var(--lilac);
        margin-bottom: 18px;
      }
      .headline {
        font-family: "Burbank Big", "Inter", sans-serif;
        font-size: 118px;
        line-height: 0.95;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.45), 0 0 26px rgba(0, 0, 0, 0.55);
      }
      .headline em {
        font-style: normal;
        color: var(--green);
      }
      .rule {
        margin-top: 26px;
        width: 300px;
        height: 7px;
        background: var(--red);
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="storytime-cover" data-start="0" data-duration="1" data-fps="30" data-width="1080" data-height="1920">
      <img id="bg" src="bg.jpg" alt="" />
      <div id="scrim"></div>
      <div id="title">
        <div class="kicker">STORYTIME</div>
        <div class="headline">I almost got in a<br /><em>fight with a thief</em></div>
        <div class="rule"></div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
      </script>
    </div>
  </body>
</html>
