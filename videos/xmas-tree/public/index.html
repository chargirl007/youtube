<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Burbank Big";
        src: url("fonts/BurbankBigRegular-Black.otf") format("opentype");
        font-weight: 900;
        font-display: block;
      }
      :root {
        --pink: #ff3ea5;
        --red: #ff2a3a;
        --yellow: #ffd23f;
        --green: #3ee06b;
        --purple: #a66bff;
        --cyan: #3fd8ff;
        --ink: #111111;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Burbank Big", sans-serif;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }
      /* Zoom origin near screen centre-left so the player + facecam stay in frame. */
      #video-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 560px 380px;
      }
      #video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .fx {
        position: absolute;
        pointer-events: none;
        visibility: hidden;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
      }

      /* Low-HP danger vignette (pulses like a heartbeat while on 28 HP). */
      #danger {
        z-index: 2;
        background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(255, 20, 40, 0.45) 82%, rgba(190, 0, 20, 0.8) 100%);
      }
      /* Victory glow on the elim. */
      #victory {
        z-index: 2;
        background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(255, 200, 40, 0.4) 85%, rgba(255, 170, 0, 0.7) 100%);
      }
      #flash {
        z-index: 6;
        background: #fffbe8;
      }

      /* Text-only stickers: thick ink outline + hard drop shadow. */
      .say {
        z-index: 4;
        text-align: center;
        line-height: 0.95;
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 7px 0 var(--ink), 0 12px 20px rgba(0, 0, 0, 0.5);
        transform-origin: 50% 50%;
        white-space: nowrap;
      }
      .say .kicker {
        font-size: 30px;
        letter-spacing: 2px;
        color: #fff;
        -webkit-text-stroke: 8px var(--ink);
        text-shadow: 0 5px 0 var(--ink);
        margin-bottom: 12px;
      }
      #intro { left: 560px; top: 110px; font-size: 64px; color: var(--yellow); }
      #lowhp { left: 520px; top: 120px; font-size: 58px; color: var(--red); }
      #ko { position: absolute; pointer-events: none; opacity: 0; left: 0; width: 1280px; top: 200px; font-size: 190px; color: var(--yellow); }
      #saved { left: 600px; top: 120px; font-size: 64px; color: var(--green); }
      #did { left: 560px; top: 130px; font-size: 48px; color: #fff; }
      #deserved { left: 590px; top: 120px; font-size: 76px; color: var(--pink); }
      #secured { left: 540px; top: 110px; font-size: 64px; color: var(--purple); }

      /* Fighting-game VS banner. */
      #vs {
        position: absolute;
        pointer-events: none;
        z-index: 4;
        left: 0;
        top: 410px;
        width: 1280px;
        height: 180px;
      }
      #vs .bar {
        position: absolute;
        top: 30px;
        height: 120px;
        width: 700px;
        display: flex;
        align-items: center;
        font-size: 72px;
        color: #fff;
        -webkit-text-stroke: 10px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 6px 0 var(--ink);
        border-top: 6px solid var(--ink);
        border-bottom: 6px solid var(--ink);
      }
      #vs-left {
        left: -60px;
        justify-content: flex-end;
        padding-right: 150px;
        background: linear-gradient(90deg, rgba(166, 107, 255, 0) 0%, rgba(166, 107, 255, 0.92) 40%);
        clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
      }
      #vs-right {
        right: -60px;
        justify-content: flex-start;
        padding-left: 150px;
        background: linear-gradient(270deg, rgba(40, 170, 80, 0) 0%, rgba(40, 170, 80, 0.92) 40%);
        clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
      }
      #vs-mark {
        position: absolute;
        left: 0;
        width: 1280px;
        top: 0;
        text-align: center;
        font-size: 150px;
        line-height: 180px;
        color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 8px 0 var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="xmas-tree" data-start="0" data-duration="39.4333" data-fps="30" data-width="1280" data-height="720">
      <div id="video-wrap">
        <video id="bg-video" src="input-video.mp4" playsinline data-has-audio="true" data-start="0" data-duration="39.4333" data-track-index="1"></video>
      </div>

      <div id="danger" class="layer clip" data-start="6.9" data-duration="7.0" data-track-index="2"></div>
      <div id="victory" class="layer clip" data-start="13.6" data-duration="2.4" data-track-index="3"></div>

      <div id="intro" class="fx say clip" data-start="0.3" data-duration="2.0" data-track-index="4">
        <div class="kicker">UH OH…</div>
        <div>LOBBY GUY IS BACK</div>
      </div>

      <div id="vs" class="clip" data-start="2.5" data-duration="2.2" data-track-index="5">
        <div class="bar" id="vs-left">TIFF</div>
        <div class="bar" id="vs-right">XMAS TREE</div>
        <div id="vs-mark">VS</div>
      </div>

      <div id="lowhp" class="fx say clip" data-start="7.0" data-duration="3.2" data-track-index="4">
        <div class="kicker">28 HP · SPRITE IN DANGER</div>
        <div>DON'T LOSE KLOMBO!</div>
      </div>

      <div id="ko" class="say clip" data-start="13.6" data-duration="1.3" data-track-index="5">K.O.!</div>

      <div id="saved" class="fx say clip" data-start="15.0" data-duration="3.4" data-track-index="4">
        <div class="kicker">KLOMBO SPRITE</div>
        <div>SAVED!</div>
      </div>

      <div id="did" class="fx say clip" data-start="28.6" data-duration="1.7" data-track-index="4">(SHE LITERALLY JUST DID)</div>

      <div id="deserved" class="fx say clip" data-start="33.95" data-duration="2.3" data-track-index="5">HE DESERVED IT.</div>

      <div id="secured" class="fx say clip" data-start="37.4" data-duration="2.0" data-track-index="4">
        <div class="kicker">STATUS</div>
        <div>SPRITE SECURED</div>
      </div>

      <div id="flash" class="layer clip" data-start="13.6" data-duration="0.3" data-track-index="6"></div>

      <!-- Sound effects (bundled Pixabay library). Riser is trimmed so its peak lands on the elim. -->
      <audio id="sfx-intro" class="clip" src="sfx/notification.mp3" data-start="0.3" data-duration="1.5" data-track-index="7" data-volume="1.2"></audio>
      <audio id="sfx-vs-in" class="clip" src="sfx/whoosh-short.mp3" data-start="2.45" data-duration="0.57" data-track-index="8" data-volume="0.8"></audio>
      <audio id="sfx-vs-hit" class="clip" src="sfx/impact-bass-1.mp3" data-start="2.75" data-duration="1.5" data-track-index="9" data-volume="0.3"></audio>
      <audio id="sfx-hpdrop" class="clip" src="sfx/impact-bass-2.mp3" data-start="6.9" data-duration="1.8" data-track-index="10" data-volume="0.3"></audio>
      <audio id="sfx-beep1" class="clip" src="sfx/ping.mp3" data-start="7.6" data-duration="0.8" data-track-index="7" data-volume="0.45"></audio>
      <audio id="sfx-beep2" class="clip" src="sfx/ping.mp3" data-start="8.6" data-duration="0.8" data-track-index="7" data-volume="0.45"></audio>
      <audio id="sfx-beep3" class="clip" src="sfx/ping.mp3" data-start="9.6" data-duration="0.8" data-track-index="7" data-volume="0.45"></audio>
      <audio id="sfx-riser" class="clip" src="sfx/riser.mp3" data-start="11.4" data-media-start="7.83" data-duration="2.2" data-track-index="8" data-volume="0.35"></audio>
      <audio id="sfx-ko" class="clip" src="sfx/impact-bass-1.mp3" data-start="13.6" data-duration="2.12" data-track-index="9" data-volume="0.4"></audio>
      <audio id="sfx-saved" class="clip" src="sfx/sparkle.mp3" data-start="15.0" data-duration="1.8" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-did" class="clip" src="sfx/pop.mp3" data-start="28.6" data-duration="0.72" data-track-index="7" data-volume="1"></audio>
      <audio id="sfx-deserved" class="clip" src="sfx/pop.mp3" data-start="33.95" data-duration="0.72" data-track-index="7" data-volume="1"></audio>
      <audio id="sfx-secured" class="clip" src="sfx/chime.mp3" data-start="37.4" data-duration="2.0" data-track-index="8" data-volume="1.4"></audio>

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const tl = window.gsap.timeline({ paused: true });
          const popIn = (sel, t, rot) => {
            tl.set(sel, { visibility: "visible" }, t);
            tl.fromTo(sel, { scale: 0.3, rotation: rot - 8, opacity: 0 }, { scale: 1, rotation: rot, opacity: 1, duration: 0.32, ease: "back.out(2.4)" }, t);
          };
          const popOut = (sel, t) => tl.to(sel, { scale: 0.7, opacity: 0, duration: 0.18, ease: "power2.in" }, t);
          const shake = (t0, amp) => {
            [[1, -0.7], [-0.9, 0.6], [0.7, 0.5], [-0.5, -0.4], [0.3, 0.2], [0, 0]].forEach(([x, y], i) => {
              tl.to("#video-wrap", { x: x * amp, y: y * amp, duration: 0.045, ease: "none" }, t0 + i * 0.045);
            });
          };

          // ── Camera.
          tl.fromTo("#video-wrap", { scale: 1, x: 0, y: 0 }, { scale: 1.04, duration: 2.4, ease: "power1.inOut" }, 0);
          tl.to("#video-wrap", { scale: 1, duration: 0.3, ease: "power2.out" }, 2.45);
          shake(2.75, 8);
          // The hit: snap in + shake, then a slow tense push while on 28 HP.
          tl.to("#video-wrap", { scale: 1.12, duration: 0.12, ease: "power4.out" }, 6.95);
          shake(6.95, 14);
          tl.to("#video-wrap", { scale: 1.04, duration: 0.6, ease: "power2.inOut" }, 7.6);
          tl.to("#video-wrap", { scale: 1.16, duration: 5.4, ease: "power1.in" }, 8.2);
          // The elim: punch, shake, then settle.
          tl.to("#video-wrap", { scale: 1.25, duration: 0.1, ease: "power4.out" }, 13.6);
          shake(13.62, 16);
          tl.to("#video-wrap", { scale: 1, duration: 0.6, ease: "power2.inOut" }, 14.4);
          // "GET WRECKED": quick hype punches.
          [14.95, 15.9, 16.9].forEach((t) => {
            tl.to("#video-wrap", { scale: 1.08, duration: 0.08, ease: "power3.out" }, t);
            tl.to("#video-wrap", { scale: 1, duration: 0.35, ease: "power2.out" }, t + 0.1);
          });

          // ── Low-HP danger: heartbeat pulse from the hit until the elim.
          tl.fromTo("#danger", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 6.9);
          tl.to("#danger", { opacity: 0.35, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 11 }, 7.1);
          tl.to("#danger", { opacity: 0, duration: 0.25 }, 13.6);

          // ── Victory glow + flash on the elim.
          tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 13.6);
          tl.fromTo("#victory", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 13.6);
          tl.to("#victory", { opacity: 0, duration: 0.8, ease: "power2.out" }, 15.2);

          // ── Stickers.
          popIn("#intro", 0.3, -3);
          popOut("#intro", 2.1);

          tl.fromTo("#vs-left", { x: -760 }, { x: 0, duration: 0.25, ease: "power3.out", immediateRender: true }, 2.5);
          tl.fromTo("#vs-right", { x: 760 }, { x: 0, duration: 0.25, ease: "power3.out", immediateRender: true }, 2.5);
          tl.fromTo("#vs-mark", { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in", immediateRender: true }, 2.55);
          tl.to("#vs-left", { x: -760, duration: 0.2, ease: "power2.in" }, 4.45);
          tl.to("#vs-right", { x: 760, duration: 0.2, ease: "power2.in" }, 4.45);
          tl.to("#vs-mark", { opacity: 0, scale: 0.6, duration: 0.18 }, 4.45);

          popIn("#lowhp", 7.0, -2);
          tl.to("#lowhp", { opacity: 0.55, duration: 0.25, yoyo: true, repeat: 5, ease: "none" }, 7.6);
          popOut("#lowhp", 10.0);

          tl.fromTo("#ko", { scale: 2.6, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.18, ease: "power4.in", immediateRender: true }, 13.6);
          popOut("#ko", 14.7);

          popIn("#saved", 15.0, -3);
          popOut("#saved", 18.2);
          popIn("#did", 28.6, 2);
          popOut("#did", 30.1);
          popIn("#deserved", 33.95, -3);
          popOut("#deserved", 36.05);
          popIn("#secured", 37.4, -2);

          window.__timelines = window.__timelines || {};
          window.__timelines["xmas-tree"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
