<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Burbank Big";
        src: url("fonts/BurbankBigRegular-Black.otf") format("opentype");
        font-weight: 900;
        font-display: block;
      }
      :root {
        --pink: #ff3ea5;
        --red: #ff2a3a;
        --yellow: #ffd23f;
        --green: #3ee06b;
        --purple: #a66bff;
        --ink: #111111;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Burbank Big", sans-serif;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }
      /* Zoom origin on her face (centre-left of frame). */
      #video-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 520px 250px;
      }
      #video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .fx {
        position: absolute;
        pointer-events: none;
        visibility: hidden;
      }

      /* Text-only stickers: thick ink outline + hard drop shadow. */
      .say {
        z-index: 4;
        text-align: center;
        line-height: 0.95;
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 7px 0 var(--ink), 0 12px 20px rgba(0, 0, 0, 0.5);
        transform-origin: 50% 50%;
        white-space: nowrap;
      }
      .say .kicker {
        font-size: 30px;
        letter-spacing: 2px;
        color: #fff;
        -webkit-text-stroke: 8px var(--ink);
        text-shadow: 0 5px 0 var(--ink);
        margin-bottom: 12px;
      }
      #title { left: 760px; top: 150px; font-size: 72px; color: var(--yellow); }
      #target-txt { left: 790px; top: 90px; font-size: 56px; color: var(--red); }
      #question { left: 790px; top: 44px; font-size: 58px; color: var(--yellow); }

      /* Sprite lineup on the right. */
      .sprite {
        z-index: 3;
        width: 150px;
        filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.55));
        transform-origin: 50% 80%;
      }
      #sp-pink { left: 790px; top: 260px; }
      #sp-gold { left: 945px; top: 230px; }
      #sp-green { left: 1100px; top: 260px; }
      #sp-blue { left: 865px; top: 440px; }
      #sp-purple { left: 1020px; top: 440px; }

      /* Progress chip: the series hook. */
      #progress {
        z-index: 4;
        left: 870px;
        top: 632px;
        font-size: 40px;
        color: #fff;
        -webkit-text-stroke: 9px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 5px 0 var(--ink);
        white-space: nowrap;
      }
      #progress b {
        color: var(--green);
        font-weight: inherit;
      }

      /* Lock-on reticle over her ("target on my back"). */
      #reticle {
        position: absolute;
        pointer-events: none;
        opacity: 0;
        z-index: 3;
        left: 410px;
        top: 340px;
        width: 300px;
        height: 300px;
      }
      #danger {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at 40% 50%, transparent 50%, rgba(255, 20, 40, 0.35) 85%, rgba(190, 0, 20, 0.65) 100%);
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="klombo-intro" data-start="0" data-duration="9.6333" data-fps="30" data-width="1280" data-height="720">
      <div id="video-wrap">
        <video id="bg-video" src="input-video.mp4" playsinline data-has-audio="true" data-start="0" data-duration="9.6333" data-track-index="1"></video>
      </div>

      <div id="danger" class="clip" data-start="5.85" data-duration="1.3" data-track-index="2"></div>

      <div id="title" class="fx say clip" data-start="0.45" data-duration="2.9" data-track-index="3">
        <div class="kicker">TODAY'S CHALLENGE</div>
        <div>MASTER EVERY<br />KLOMBO</div>
      </div>

      <img id="sp-pink" class="fx sprite clip" src="img/pink.png" alt="" data-start="3.45" data-duration="6.1833" data-track-index="4" />
      <img id="sp-gold" class="fx sprite clip" src="img/gold.png" alt="" data-start="3.57" data-duration="6.0633" data-track-index="5" />
      <img id="sp-green" class="fx sprite clip" src="img/green.png" alt="" data-start="3.69" data-duration="5.9433" data-track-index="6" />
      <img id="sp-blue" class="fx sprite clip" src="img/blue.png" alt="" data-start="3.81" data-duration="5.8233" data-track-index="7" />
      <img id="sp-purple" class="fx sprite clip" src="img/purple.png" alt="" data-start="3.93" data-duration="5.7033" data-track-index="8" />

      <div id="progress" class="fx clip" data-start="4.1" data-duration="5.5333" data-track-index="9">MASTERED: <b>0</b>/5</div>

      <svg id="reticle" class="clip" viewBox="0 0 300 300" data-start="5.7" data-duration="1.4" data-track-index="10">
        <g fill="none" stroke="#ff2a3a" stroke-width="10" stroke-linecap="round">
          <circle cx="150" cy="150" r="110" stroke-dasharray="120 52" />
          <circle cx="150" cy="150" r="22" />
          <line x1="150" y1="8" x2="150" y2="70" />
          <line x1="150" y1="230" x2="150" y2="292" />
          <line x1="8" y1="150" x2="70" y2="150" />
          <line x1="230" y1="150" x2="292" y2="150" />
        </g>
      </svg>
      <div id="target-txt" class="fx say clip" data-start="5.9" data-duration="1.15" data-track-index="11">
        <div class="kicker">WARNING</div>
        <div>HUGE TARGET<br />ON MY BACK</div>
      </div>

      <div id="question" class="fx say clip" data-start="7.1" data-duration="2.5333" data-track-index="11">
        <div class="kicker">CAN I MASTER &amp;</div>
        <div>EXTRACT THEM<br />ALL?</div>
      </div>

      <!-- Sound effects (bundled Pixabay library). Riser is trimmed to peak on the last frame. -->
      <audio id="sfx-open" class="clip" src="sfx/whoosh-short.mp3" data-start="0" data-duration="0.57" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-title" class="clip" src="sfx/impact-bass-1.mp3" data-start="0.45" data-duration="1.5" data-track-index="13" data-volume="0.25"></audio>
      <audio id="sfx-p1" class="clip" src="sfx/pop.mp3" data-start="3.45" data-duration="0.5" data-track-index="14" data-volume="1"></audio>
      <audio id="sfx-p2" class="clip" src="sfx/pop.mp3" data-start="3.57" data-duration="0.5" data-track-index="15" data-volume="1"></audio>
      <audio id="sfx-p3" class="clip" src="sfx/pop.mp3" data-start="3.69" data-duration="0.5" data-track-index="16" data-volume="1"></audio>
      <audio id="sfx-p4" class="clip" src="sfx/pop.mp3" data-start="3.81" data-duration="0.5" data-track-index="17" data-volume="1"></audio>
      <audio id="sfx-p5" class="clip" src="sfx/pop.mp3" data-start="3.93" data-duration="0.5" data-track-index="18" data-volume="1"></audio>
      <audio id="sfx-lock1" class="clip" src="sfx/ping.mp3" data-start="5.7" data-duration="0.5" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-lock2" class="clip" src="sfx/ping.mp3" data-start="5.9" data-duration="0.8" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-riser" class="clip" src="sfx/riser.mp3" data-start="7.1" data-media-start="7.5" data-duration="2.5333" data-track-index="16" data-volume="0.35"></audio>

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const tl = window.gsap.timeline({ paused: true });
          const popIn = (sel, t, rot, dur) => {
            tl.set(sel, { visibility: "visible" }, t);
            tl.fromTo(sel, { scale: 0.3, rotation: rot - 8, opacity: 0 }, { scale: 1, rotation: rot, opacity: 1, duration: dur || 0.32, ease: "back.out(2.4)" }, t);
          };
          const popOut = (sel, t) => tl.to(sel, { scale: 0.7, opacity: 0, duration: 0.18, ease: "power2.in" }, t);

          // ── Camera: snap-in hook, settle, push on the stakes, slow push through the question.
          tl.fromTo("#video-wrap", { scale: 1.25 }, { scale: 1.05, duration: 0.45, ease: "power3.out" }, 0);
          tl.to("#video-wrap", { scale: 1, duration: 2.8, ease: "power1.inOut" }, 0.45);
          tl.to("#video-wrap", { scale: 1.1, duration: 0.12, ease: "power4.out" }, 5.9);
          [[8, -6], [-7, 5], [5, 3], [-3, -2], [0, 0]].forEach(([x, y], i) => {
            tl.to("#video-wrap", { x, y, duration: 0.045, ease: "none" }, 5.92 + i * 0.045);
          });
          tl.to("#video-wrap", { scale: 1.02, duration: 0.4, ease: "power2.inOut" }, 7.0);
          tl.to("#video-wrap", { scale: 1.12, duration: 2.2, ease: "power1.in" }, 7.4);

          // ── Title.
          popIn("#title", 0.45, -3);
          popOut("#title", 3.15);

          // ── Sprite lineup pops in one by one, idles with a bob.
          ["#sp-pink", "#sp-gold", "#sp-green", "#sp-blue", "#sp-purple"].forEach((sel, i) => {
            const t = 3.45 + i * 0.12;
            popIn(sel, t, i % 2 ? 5 : -5, 0.3);
            tl.to(sel, { y: -8, duration: 0.55, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.35 + i * 0.07);
          });
          popIn("#progress", 4.1, 0);

          // ── Stakes: reticle locks on, red edge, warning text.
          tl.fromTo("#reticle", { scale: 2.2, opacity: 0, rotation: -60 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.28, ease: "power3.out", transformOrigin: "50% 50%", immediateRender: true }, 5.7);
          tl.to("#reticle", { rotation: 30, duration: 1.0, ease: "none" }, 5.98);
          tl.to("#reticle", { opacity: 0, duration: 0.2 }, 6.9);
          tl.fromTo("#danger", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 5.85);
          tl.to("#danger", { opacity: 0.4, duration: 0.3, yoyo: true, repeat: 2, ease: "sine.inOut" }, 6.0);
          tl.to("#danger", { opacity: 0, duration: 0.25 }, 6.9);
          popIn("#target-txt", 5.9, -2);
          popOut("#target-txt", 6.88);

          // ── Question hook: sprites do a hype wave, the question stays to the end.
          popIn("#question", 7.1, -2);
          ["#sp-pink", "#sp-gold", "#sp-green", "#sp-blue", "#sp-purple"].forEach((sel, i) => {
            tl.to(sel, { y: -26, scale: 1.08, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 7.25 + i * 0.09);
          });
          tl.to("#question", { scale: 1.06, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 7.6);

          window.__timelines = window.__timelines || {};
          window.__timelines["klombo-intro"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
