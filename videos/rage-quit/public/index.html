<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      @font-face {
        font-family: "Burbank Big";
        src: url("fonts/BurbankBigRegular-Black.otf") format("opentype");
        font-weight: 900;
        font-display: block;
      }
      :root {
        --pink: #ff3ea5;
        --red: #e8202a;
        --yellow: #ffd23f;
        --green: #3ee06b;
        --ink: #111111;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Burbank Big", sans-serif;
      }
      #stage {
        position: relative;
        width: 720px;
        height: 1280px;
        overflow: hidden;
      }
      #video-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 360px 280px;
      }
      #video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .fx {
        position: absolute;
        pointer-events: none;
        visibility: hidden;
      }
      #rage-tint {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        z-index: 2;
        background: radial-gradient(ellipse at 50% 35%, transparent 35%, rgba(230, 20, 0, 0.55) 80%, rgba(170, 0, 0, 0.85) 100%);
      }

      /* Text-only stickers: thick ink outline + hard drop shadow, no box. */
      .say {
        z-index: 4;
        left: 0;
        width: 720px;
        text-align: center;
        line-height: 0.95;
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 8px 0 var(--ink), 0 12px 20px rgba(0, 0, 0, 0.5);
        transform-origin: 50% 50%;
      }
      .say .kicker {
        font-size: 34px;
        letter-spacing: 2px;
        color: #fff;
        -webkit-text-stroke: 8px var(--ink);
        text-shadow: 0 5px 0 var(--ink);
        margin-bottom: 12px;
      }
      #last-words {
        top: 900px;
        font-size: 74px;
        color: var(--yellow);
      }
      #better {
        top: 700px;
        font-size: 84px;
        color: var(--pink);
      }
      #better svg {
        vertical-align: -6px;
        margin-left: 8px;
      }

      /* Rage-quit loading bar over the lower gameplay. */
      #loading {
        z-index: 4;
        left: 70px;
        top: 860px;
        width: 580px;
        text-align: center;
      }
      #loading .label {
        font-size: 44px;
        color: #fff;
        -webkit-text-stroke: 10px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 6px 0 var(--ink);
        margin-bottom: 10px;
      }
      #loading .track {
        position: relative;
        height: 46px;
        border: 6px solid var(--ink);
        border-radius: 23px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 6px 0 var(--ink);
        overflow: hidden;
      }
      #loading .fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: linear-gradient(90deg, var(--yellow), var(--red));
      }
      #loading .pct {
        position: absolute;
        inset: 0;
        font-size: 34px;
        line-height: 36px;
        color: var(--ink);
      }
      /* Arcade CRT pass over everything (video is graded separately via data-color-grading). */
      #crt {
        position: absolute;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        background:
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.07) 0px, rgba(0, 0, 0, 0.07) 1px, transparent 1px, transparent 3px);
        mix-blend-mode: multiply;
      }
    </style>
  </head>
  <body>

quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" data-hf-id="hf-5sig" id="bg-video" src="input-video.mp4" playsinline data-has-audio="true" data-start="0" data-duration="15.1" data-track-index="1"></video>
      </div>

      <div data-hf-id="hf-g1fx" id="rage-tint" class="clip" data-start="6.0" data-duration="4.6" data-track-index="2"></div>

      <div data-hf-id="hf-1ime" id="last-words" class="fx say clip" data-start="5.45" data-duration="0.55" data-track-index="3">

        <div data-hf-id="hf-5s65">LAST WORDS…</div>
      </div>

      <div data-hf-id="hf-ryg2" id="loading" class="fx clip" data-start="6.6" data-duration="4.0" data-track-index="4">
        <div data-hf-id="hf-9jzf" class="label" id="load-label">RAGE QUIT LOADING…</div>
        <div data-hf-id="hf-64lp" class="track"><div data-hf-id="hf-gxxt" class="fill" id="load-fill"></div><div data-hf-id="hf-lqya" class="pct" id="load-pct">0%</div></div>
      </div>

      <div data-hf-id="hf-690u" id="better" class="fx say clip" data-start="10.6" data-duration="2.1" data-track-index="5">
        <div data-hf-id="hf-bo3x" class="kicker">STATUS:</div>
        <div data-hf-id="hf-h9ju">FEELING BETTER<br data-hf-id="hf-x5px">ALREADY<svg data-hf-id="hf-uws0" viewBox="0 0 100 100" width="70" height="70"><path data-hf-id="hf-1buk" d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#ff3ea5" stroke="#111" stroke-width="8" /></svg></div>
      </div>


      <div data-hf-id="hf-7qz2" id="crt"></div>

      <!-- Sound effects (bundled Pixabay library). -->

      <audio data-hf-id="hf-9t62" id="sfx-lastwords" class="clip" src="sfx/whoosh-short.mp3" data-start="5.4" data-duration="0.57" data-track-index="8" data-volume="0.7"></audio>
      <audio data-hf-id="hf-dan2" id="sfx-second" class="clip" src="sfx/impact-bass-1.mp3" data-start="6.0" data-duration="2.12" data-track-index="9" data-volume="0.4"></audio>
      <audio data-hf-id="hf-dlir" id="sfx-k1" class="clip" src="sfx/key-press.mp3" data-start="7.2" data-duration="0.4" data-track-index="10" data-volume="0.8"></audio>
      <audio data-hf-id="hf-z04h" id="sfx-k2" class="clip" src="sfx/key-press.mp3" data-start="8.0" data-duration="0.4" data-track-index="10" data-volume="0.8"></audio>
      <audio data-hf-id="hf-ks1w" id="sfx-k3" class="clip" src="sfx/key-press.mp3" data-start="8.8" data-duration="0.4" data-track-index="10" data-volume="0.8"></audio>
      <audio data-hf-id="hf-trv0" id="sfx-k4" class="clip" src="sfx/key-press.mp3" data-start="9.6" data-duration="0.4" data-track-index="10" data-volume="0.8"></audio>
      <audio data-hf-id="hf-jyr9" id="sfx-complete" class="clip" src="sfx/glitch-1.mp3" data-start="10.2" data-duration="0.9" data-track-index="7" data-volume="0.35"></audio>
      <audio data-hf-id="hf-2d8z" id="sfx-better" class="clip" src="sfx/sparkle.mp3" data-start="10.6" data-duration="1.8" data-track-index="8" data-volume="0.5"></audio>

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const tl = window.gsap.timeline({ paused: true });
          const popIn = (sel, t, rot) => {
            tl.set(sel, { visibility: "visible" }, t);
            tl.fromTo(sel, { scale: 0.3, rotation: rot - 8, opacity: 0 }, { scale: 1, rotation: rot, opacity: 1, duration: 0.32, ease: "back.out(2.4)" }, t);
          };
          const popOut = (sel, t) => tl.to(sel, { scale: 0.7, opacity: 0, duration: 0.18, ease: "power2.in" }, t);

          // ── Camera.
          // Zoom into the post text while it's read out, then back.
          tl.fromTo("#video-wrap", { scale: 1, x: 0, y: 0, transformOrigin: "240px 330px" }, { scale: 1.45, duration: 0.35, ease: "power3.out" }, 2.0);
          tl.to("#video-wrap", { scale: 1.5, duration: 1.2, ease: "none" }, 2.35);
          tl.to("#video-wrap", { scale: 1, duration: 0.35, ease: "power2.inOut" }, 3.6);
          // Smug slow push on "girl I know the feeling".
          tl.set("#video-wrap", { transformOrigin: "360px 520px" }, 4.9);
          tl.fromTo("#video-wrap", { scale: 1 }, { scale: 1.12, duration: 1.05, ease: "power1.inOut", immediateRender: false }, 4.9);
          // Snap onto the facecam for the meltdown, with shake bursts.
          tl.set("#video-wrap", { transformOrigin: "360px 280px", scale: 1 }, 5.95);
          tl.to("#video-wrap", { scale: 1.3, duration: 0.12, ease: "power4.out" }, 6.0);
          [6.05, 7.4, 8.6].forEach((t0) => {
            [[12, -8], [-10, 7], [8, 5], [-6, -5], [4, 3], [0, 0]].forEach(([x, y], i) => {
              tl.to("#video-wrap", { x, y, duration: 0.045, ease: "none" }, t0 + i * 0.045);
            });
          });
          tl.to("#video-wrap", { scale: 1.42, duration: 2.0, ease: "none" }, 8.2);
          // Deadpan: cut back to normal for the calm-down.
          tl.to("#video-wrap", { scale: 1, x: 0, y: 0, duration: 0.25, ease: "power2.out" }, 10.4);
          // Slow push on the slump.
          tl.to("#video-wrap", { scale: 1.15, duration: 2.2, ease: "power1.inOut" }, 12.8);

          // ── Red rage tint during the scream.
          tl.fromTo("#rage-tint", { opacity: 0 }, { opacity: 0.9, duration: 0.1 }, 6.0);
          tl.to("#rage-tint", { opacity: 0.55, duration: 0.15, yoyo: true, repeat: 11, ease: "sine.inOut" }, 6.2);
          tl.to("#rage-tint", { opacity: 0, duration: 0.3 }, 10.2);

          // ── Stickers.
          popIn("#last-words", 5.45, -3);
          popIn("#better", 10.6, -2);
          popOut("#better", 12.5);

          // ── Rage-quit loading bar: 0 -> 100% across the scream, stamps COMPLETE.
          popIn("#loading", 6.6, 0);
          tl.fromTo("#load-fill", { width: 0 }, { width: "100%", duration: 3.6, ease: "power1.in" }, 6.6);
          (function () {
            const o = { v: 0 };
            tl.to(o, {
              v: 100, duration: 3.6, ease: "power1.in",
              onUpdate: function () { const el = document.querySelector("#load-pct"); if (el) el.textContent = Math.round(o.v) + "%"; },
            }, 6.6);
          })();
          tl.call(function () { const el = document.querySelector("#load-label"); if (el) el.textContent = "RAGE QUIT LOADING…"; }, null, 6.6);
          tl.call(function () { const el = document.querySelector("#load-label"); if (el) el.textContent = "RAGE QUIT: COMPLETE"; }, null, 10.2);
          tl.fromTo("#loading", { scale: 1 }, { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, 10.2);
          popOut("#loading", 10.4);

          window.__timelines = window.__timelines || {};
          window.__timelines["rage-quit"] = tl;
        })();
      </script>
